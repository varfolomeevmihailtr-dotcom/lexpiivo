<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Эликсир: понятный сценарий для команды</title><desc id="desc">Три этапа: взять и удерживать ранние источники очков, подготовить группу к открытию центра, после захвата укрепить позиции и перераспределить свободных участников.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d2ad65"/></marker></defs><rect width="1000" height="480" rx="24" fill="#0b211c"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#d2ad65" text-anchor="start" font-weight="700">[LEX]PIIVO  ·  СЕРВЕР 347</text><text x="40" y="85" font-size="28" fill="#f3ead3" text-anchor="start" font-weight="700">Эликсир: понятный сценарий для команды</text><text x="40" y="118" font-size="17" fill="#bac8b4" text-anchor="start" font-weight="400">Один координатор. Цели назначены заранее. Счёт важнее одиночного рейтинга</text><rect x="40" y="157" width="280" height="241" rx="18" fill="#11352b" stroke="#426451" /><circle cx="75" cy="188" r="18" fill="#d2ad65"/><text x="75" y="195" font-size="20" fill="#0b211c" text-anchor="middle" font-weight="700">1</text><text x="60" y="235" font-size="14" fill="#d2ad65" text-anchor="start" font-weight="700">СТАРТ</text><text x="60" y="267" font-size="12" fill="#f3ead3" text-anchor="start" font-weight="700">Мастерские и наблюдение</text><text x="60" y="304" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Назначить первые здания</text><text x="60" y="332" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Держать источники очков</text><text x="60" y="360" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Использовать лечение</text><rect x="360" y="157" width="280" height="241" rx="18" fill="#11352b" stroke="#426451" /><circle cx="395" cy="188" r="18" fill="#d2ad65"/><text x="395" y="195" font-size="20" fill="#0b211c" text-anchor="middle" font-weight="700">2</text><text x="380" y="235" font-size="14" fill="#d2ad65" text-anchor="start" font-weight="700">ОТКРЫВАЕТСЯ ЦЕНТР</text><text x="380" y="267" font-size="12" fill="#f3ead3" text-anchor="start" font-weight="700">Замок и боевые усиления</text><text x="380" y="304" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Сверить таймер открытия</text><text x="380" y="332" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Собрать ударную группу</text><text x="380" y="360" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Оставить защиту в тылу</text><rect x="680" y="157" width="280" height="241" rx="18" fill="#11352b" stroke="#426451" /><circle cx="715" cy="188" r="18" fill="#d2ad65"/><text x="715" y="195" font-size="20" fill="#0b211c" text-anchor="middle" font-weight="700">3</text><text x="700" y="235" font-size="14" fill="#d2ad65" text-anchor="start" font-weight="700">ПОСЛЕ ЗАХВАТА</text><text x="700" y="267" font-size="12" fill="#f3ead3" text-anchor="start" font-weight="700">Удержание и перераспределение</text><text x="700" y="304" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Укрепить занятые здания</text><text x="700" y="332" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Перенаправить свободных</text><text x="700" y="360" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Проверить разницу счёта</text><line x1="326" y1="278" x2="354" y2="278" stroke="#d2ad65" stroke-width="3" marker-end="url(#arrow)"/><line x1="646" y1="278" x2="674" y2="278" stroke="#d2ad65" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="445" font-size="16" fill="#bac8b4" text-anchor="middle" font-weight="400">План меняется по обстановке: не бросай все здания ради одной неудачной атаки</text></g></svg>