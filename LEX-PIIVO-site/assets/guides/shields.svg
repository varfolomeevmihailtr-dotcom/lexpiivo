<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Щит должен закрывать всё боевое окно</title><desc id="desc">Диаграмма сравнивает щит, действующий до конца боя, с щитом, который заканчивается раньше. Конкретные часы не заданы.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d2ad65"/></marker></defs><rect width="1000" height="480" rx="24" fill="#0b211c"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#d2ad65" text-anchor="start" font-weight="700">[LEX]PIIVO  ·  СЕРВЕР 347</text><text x="40" y="85" font-size="28" fill="#f3ead3" text-anchor="start" font-weight="700">Щит должен закрывать всё боевое окно</text><text x="40" y="118" font-size="17" fill="#bac8b4" text-anchor="start" font-weight="400">Сравнивай время окончания щита с концом боевой фазы</text><rect x="40" y="148" width="920" height="270" rx="18" fill="#11352b" stroke="#426451" /><line x1="310" y1="190" x2="310" y2="380" stroke="#426451" stroke-width="2" stroke-dasharray="5 6"/><line x1="790" y1="190" x2="790" y2="380" stroke="#426451" stroke-width="2" stroke-dasharray="5 6"/><text x="310" y="182" font-size="14" fill="#d2ad65" text-anchor="middle" font-weight="700">НАЧАЛО БОЯ</text><text x="790" y="182" font-size="14" fill="#d2ad65" text-anchor="middle" font-weight="700">КОНЕЦ БОЯ</text><text x="64" y="226" font-size="16" fill="#bac8b4" text-anchor="start" font-weight="400">Боевое окно</text><rect x="310" y="207" width="480" height="28" rx="8" fill="#815e36" stroke="#d2ad65" /><text x="64" y="293" font-size="16" fill="#74b98a" text-anchor="start" font-weight="700">Защита есть</text><rect x="260" y="267" width="590" height="38" rx="9" fill="#2d694d" stroke="#74b98a" /><text x="555" y="292" font-size="15" fill="#f3ead3" text-anchor="middle" font-weight="700">Щит перекрывает всё окно</text><text x="64" y="365" font-size="16" fill="#d77968" text-anchor="start" font-weight="700">Есть разрыв</text><rect x="260" y="339" width="370" height="38" rx="9" fill="#56352b" stroke="#d77968" /><rect x="630" y="339" width="160" height="38" rx="9" fill="#61362e" stroke="#d77968" stroke-dasharray="4 4"/><text x="709" y="364" font-size="14" fill="#f3ead3" text-anchor="middle" font-weight="700">БЕЗ ЩИТА</text><text x="500" y="452" font-size="16" fill="#bac8b4" text-anchor="middle" font-weight="400">После военного действия проверь боевой режим и активный таймер щита</text></g></svg>