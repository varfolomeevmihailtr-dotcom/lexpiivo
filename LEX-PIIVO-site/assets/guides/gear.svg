<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Экипировка: усиливаем нужную роль</title><desc id="desc">Герою урона в приоритете полезные оружие и перчатки; танку броня и ботинки с подходящими защитными характеристиками. Конкретный предмет нужно сравнить по эффектам.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d2ad65"/></marker></defs><rect width="1000" height="480" rx="24" fill="#0b211c"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#d2ad65" text-anchor="start" font-weight="700">[LEX]PIIVO  ·  СЕРВЕР 347</text><text x="40" y="85" font-size="28" fill="#f3ead3" text-anchor="start" font-weight="700">Экипировка: усиливаем нужную роль</text><text x="40" y="118" font-size="17" fill="#bac8b4" text-anchor="start" font-weight="400">Приоритет по роли: сравнивай редкость, уровень и эффекты конкретной вещи</text><rect x="40" y="148" width="442" height="249" rx="18" fill="#11352b" stroke="#426451" /><rect x="518" y="148" width="442" height="249" rx="18" fill="#11352b" stroke="#426451" /><text x="70" y="190" font-size="21" fill="#d2ad65" text-anchor="start" font-weight="700">ГЕРОЙ УРОНА</text><text x="548" y="190" font-size="21" fill="#d2ad65" text-anchor="start" font-weight="700">ТАНК</text><path d="M102 228L110 220L149 259L141 267Z M140 265L151 276 M143 280L155 268" stroke="#d2ad65" stroke-width="5" fill="none"/><path d="M282 232V264L291 277H309L319 264V236L312 229L306 236L300 225L294 237L287 229Z" stroke="#d2ad65" stroke-width="3" fill="none"/><text x="126" y="308" font-size="17" fill="#f3ead3" text-anchor="middle" font-weight="700">Оружие</text><text x="300" y="308" font-size="17" fill="#f3ead3" text-anchor="middle" font-weight="700">Перчатки</text><text x="70" y="354" font-size="16" fill="#bac8b4" text-anchor="start" font-weight="400">Атака и полезные атакующие эффекты</text><path d="M586 228L604 220L619 233L634 220L652 228L646 245H637V278H601V245H592Z" stroke="#d2ad65" stroke-width="3" fill="none"/><path d="M798 223H826V257L844 266V278H799V265L803 257Z" stroke="#d2ad65" stroke-width="3" fill="none"/><text x="619" y="308" font-size="17" fill="#f3ead3" text-anchor="middle" font-weight="700">Броня</text><text x="820" y="308" font-size="17" fill="#f3ead3" text-anchor="middle" font-weight="700">Ботинки</text><text x="548" y="354" font-size="16" fill="#bac8b4" text-anchor="start" font-weight="400">Здоровье, защита и сопротивления</text><text x="500" y="438" font-size="15" fill="#bac8b4" text-anchor="middle" font-weight="400">Это приоритет распределения, а не запрет: характеристики слотов меняются с качеством</text></g></svg>