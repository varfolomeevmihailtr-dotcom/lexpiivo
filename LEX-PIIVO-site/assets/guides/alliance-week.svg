<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">Неделя Дуэли: копим под тему дня</title><desc id="desc">Семь дней: понедельник ворон, вторник стройка, среда исследования, четверг герои, пятница войска и развитие, суббота рейд по этапу сервера, воскресенье отдых и подготовка.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d2ad65"/></marker></defs><rect width="1000" height="480" rx="24" fill="#0b211c"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#d2ad65" text-anchor="start" font-weight="700">[LEX]PIIVO  ·  СЕРВЕР 347</text><text x="40" y="85" font-size="28" fill="#f3ead3" text-anchor="start" font-weight="700">Неделя Дуэли: копим под тему дня</text><text x="40" y="118" font-size="17" fill="#bac8b4" text-anchor="start" font-weight="400">Ориентир для накопления: перед расходом открывай задачи текущего дня</text><rect x="40" y="156" width="121" height="219" rx="16" fill="#11352b" stroke="#426451" /><text x="100" y="191" font-size="22" fill="#d2ad65" text-anchor="middle" font-weight="700">ПН</text><line x1="58" y1="210" x2="143" y2="210" stroke="#426451" stroke-width="2" /><text x="100" y="247" font-size="14" fill="#f3ead3" text-anchor="middle" font-weight="700">Ворон</text><text x="100" y="299" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">Материалы</text><text x="100" y="320" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">ворона</text><rect x="173" y="156" width="121" height="219" rx="16" fill="#11352b" stroke="#426451" /><text x="233" y="191" font-size="22" fill="#d2ad65" text-anchor="middle" font-weight="700">ВТ</text><line x1="191" y1="210" x2="276" y2="210" stroke="#426451" stroke-width="2" /><text x="233" y="247" font-size="14" fill="#f3ead3" text-anchor="middle" font-weight="700">Стройка</text><text x="233" y="299" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">Строительные</text><text x="233" y="320" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">ускорения</text><rect x="306" y="156" width="121" height="219" rx="16" fill="#11352b" stroke="#426451" /><text x="366" y="191" font-size="22" fill="#d2ad65" text-anchor="middle" font-weight="700">СР</text><line x1="324" y1="210" x2="409" y2="210" stroke="#426451" stroke-width="2" /><text x="366" y="247" font-size="14" fill="#f3ead3" text-anchor="middle" font-weight="700">Исследования</text><text x="366" y="299" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">Свитки и</text><text x="366" y="320" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">ускорения</text><rect x="439" y="156" width="121" height="219" rx="16" fill="#11352b" stroke="#d2ad65" /><text x="499" y="191" font-size="22" fill="#d2ad65" text-anchor="middle" font-weight="700">ЧТ</text><line x1="457" y1="210" x2="542" y2="210" stroke="#426451" stroke-width="2" /><text x="499" y="247" font-size="14" fill="#f3ead3" text-anchor="middle" font-weight="700">Герои</text><text x="499" y="299" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">Осколки, найм,</text><text x="499" y="320" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">значки</text><rect x="572" y="156" width="121" height="219" rx="16" fill="#11352b" stroke="#426451" /><text x="632" y="191" font-size="22" fill="#d2ad65" text-anchor="middle" font-weight="700">ПТ</text><line x1="590" y1="210" x2="675" y2="210" stroke="#426451" stroke-width="2" /><text x="632" y="247" font-size="14" fill="#f3ead3" text-anchor="middle" font-weight="700">Войска*</text><text x="632" y="299" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">Ускорения</text><text x="632" y="320" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">развития</text><rect x="705" y="156" width="121" height="219" rx="16" fill="#11352b" stroke="#d2ad65" /><text x="765" y="191" font-size="22" fill="#d2ad65" text-anchor="middle" font-weight="700">СБ</text><line x1="723" y1="210" x2="808" y2="210" stroke="#426451" stroke-width="2" /><text x="765" y="247" font-size="14" fill="#f3ead3" text-anchor="middle" font-weight="700">Рейд**</text><text x="765" y="299" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">По этапу</text><text x="765" y="320" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">сервера</text><rect x="838" y="156" width="121" height="219" rx="16" fill="#11352b" stroke="#426451" /><text x="898" y="191" font-size="22" fill="#d2ad65" text-anchor="middle" font-weight="700">ВС</text><line x1="856" y1="210" x2="941" y2="210" stroke="#426451" stroke-width="2" /><text x="898" y="247" font-size="14" fill="#f3ead3" text-anchor="middle" font-weight="700">Отдых</text><text x="898" y="299" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">Сверить запасы</text><text x="898" y="320" font-size="12" fill="#bac8b4" text-anchor="middle" font-weight="400">и план недели</text><text x="40" y="411" font-size="15" fill="#bac8b4" text-anchor="start" font-weight="400">* В пятницу также могут считаться стройка и исследования: проверь список действий</text><text x="40" y="444" font-size="15" fill="#bac8b4" text-anchor="start" font-weight="400">** Субботний рейд зависит от доступного этапа. Воскресенье — запас и подготовка</text></g></svg>