<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc"><title id="title">PvE: защищаем героев, которые наносят урон</title><desc id="desc">Схема двух танков в переднем ряду и трёх героев урона или поддержки сзади против босса. Поддержка выбирается по задаче, а не только по общему показателю мощности.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d2ad65"/></marker></defs><rect width="1000" height="480" rx="24" fill="#0b211c"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="40" y="45" font-size="14" fill="#d2ad65" text-anchor="start" font-weight="700">[LEX]PIIVO  ·  СЕРВЕР 347</text><text x="40" y="85" font-size="28" fill="#f3ead3" text-anchor="start" font-weight="700">PvE: защищаем героев, которые наносят урон</text><text x="40" y="118" font-size="17" fill="#bac8b4" text-anchor="start" font-weight="400">Танки впереди. Герои урона и подходящая поддержка — за ними</text><rect x="40" y="144" width="920" height="275" rx="18" fill="#11352b" stroke="#426451" /><text x="153" y="177" font-size="14" fill="#bac8b4" text-anchor="middle" font-weight="700">ЗАДНИЙ РЯД</text><text x="372" y="177" font-size="14" fill="#bac8b4" text-anchor="middle" font-weight="700">ПЕРЕДНИЙ РЯД</text><text x="768" y="177" font-size="14" fill="#d2ad65" text-anchor="middle" font-weight="700">БОСС</text><circle cx="153" cy="205" r="15" fill="#bac8b4"/><path d="M126 252Q128 224 153 224Q178 224 180 252Z" fill="#11352b" stroke="#bac8b4" stroke-width="3"/><text x="202" y="218" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Урон</text><circle cx="153" cy="268" r="15" fill="#bac8b4"/><path d="M126 315Q128 287 153 287Q178 287 180 315Z" fill="#11352b" stroke="#bac8b4" stroke-width="3"/><text x="202" y="295" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Урон</text><circle cx="153" cy="345" r="15" fill="#bac8b4"/><path d="M126 392Q128 364 153 364Q178 364 180 392Z" fill="#11352b" stroke="#bac8b4" stroke-width="3"/><text x="202" y="372" font-size="14" fill="#bac8b4" text-anchor="start" font-weight="400">Поддержка</text><circle cx="372" cy="219" r="15" fill="#d2ad65"/><path d="M345 266Q347 238 372 238Q397 238 399 266Z" fill="#11352b" stroke="#d2ad65" stroke-width="3"/><path d="M379 236L408 236V253Q394 270 379 253Z" fill="#0b211c" stroke="#d2ad65" stroke-width="3"/><text x="372" y="292" font-size="13" fill="#bac8b4" text-anchor="middle" font-weight="400">Танк</text><circle cx="372" cy="322" r="15" fill="#d2ad65"/><path d="M345 369Q347 341 372 341Q397 341 399 369Z" fill="#11352b" stroke="#d2ad65" stroke-width="3"/><path d="M379 339L408 339V356Q394 373 379 356Z" fill="#0b211c" stroke="#d2ad65" stroke-width="3"/><text x="372" y="395" font-size="13" fill="#bac8b4" text-anchor="middle" font-weight="400">Танк</text><line x1="440" y1="278" x2="621" y2="278" stroke="#d2ad65" stroke-width="3" marker-end="url(#arrow)"/><text x="532" y="250" font-size="14" fill="#d2ad65" text-anchor="middle" font-weight="700">БОЙ</text><path d="M724 250L709 211L743 228Q769 211 794 228L827 211L812 251Q834 299 808 335H728Q702 299 724 250Z" fill="#244034" stroke="#d2ad65" stroke-width="3"/><path d="M742 261L757 270M794 261L779 270" stroke="#d2ad65" stroke-width="5"/><path d="M750 301Q767 290 785 301" fill="none" stroke="#d2ad65" stroke-width="3"/><text x="768" y="375" font-size="14" fill="#bac8b4" text-anchor="middle" font-weight="400">Не выбирай состав</text><text x="768" y="397" font-size="14" fill="#bac8b4" text-anchor="middle" font-weight="400">только по мощности</text><text x="500" y="450" font-size="16" fill="#bac8b4" text-anchor="middle" font-weight="400">Поддержка под задачу: урон по монстрам, защита или лечение. Проверь навыки</text></g></svg>