<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[LEX]PIIVO — Мой кабинет</title><style>body{background:#101512;color:#e6efe1;font:16px system-ui;margin:0;min-height:100vh}main{max-width:720px;margin:9vh auto;padding:25px}section{padding:25px;background:#1a2b1e;border:1px solid #38523d;border-radius:16px}h1{font:42px Georgia,serif}a{color:#c5dda9}button{border:0;background:#bdd49c;color:#18251a;border-radius:8px;padding:11px 18px;font-weight:bold;cursor:pointer}input{padding:10px;background:#101512;color:#fff;border:1px solid #49604d;border-radius:7px;font:inherit;max-width:95%}label{display:block;margin:16px 0 6px}#status{color:#bed699}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script></head><body><main><p><a href="./#home">← Вернуться в штаб</a></p><section><h1 id="title">Мой кабинет</h1><p id="welcome">Загрузка профиля…</p><div id="details" hidden><p>Сервер 347 · [LEX]PIIVO</p><label for="nick">Игровой ник (поддерживает корейский и другие языки)</label><input id="nick" maxlength="40"><button id="save">Сохранить ник</button><p id="role"></p><p>Игровой прогресс пока сохраняется в браузере. Синхронизацию с облаком подключим отдельно.</p><button id="logout">Выйти из аккаунта</button></div><p id="status" role="status"></p></section></main><script>(()=>{'use strict';const sb=window.supabase.createClient('https://mcmzwkomuwzjkvggicyf.supabase.co','sb_publishable_bYnfQgWXe_6YeqU_v8CktQ_mY09szxO');const $=id=>document.getElementById(id);async function refresh(){const {data:{user}}=await sb.auth.getUser();if(!user){$('welcome').textContent='Войдите, чтобы открыть личный кабинет';$('status').innerHTML='<a href="./login.html">Войти / Зарегистрироваться →</a>';return}const {data,error}=await sb.from('clan_accounts').select('nickname,role').eq('user_id',user.id).single();if(error){$('welcome').textContent='Не удалось загрузить профиль';$('status').textContent=error.message;return}$('title').textContent='Добро пожаловать, '+data.nickname+'!';$('welcome').textContent='Ваш личный кабинет';$('details').hidden=false;$('nick').value=data.nickname;$('role').textContent='Роль: '+({admin:'Администратор',r5:'R5',r4:'R4',member:'Участник'}[data.role]||'Участник');$('save').onclick=async()=>{const nickname=$('nick').value.trim();if([...nickname].length<2||[...nickname].length>40){$('status').textContent='Ник должен содержать от 2 до 40 символов';return}const {error}=await sb.from('clan_accounts').update({nickname}).eq('user_id',user.id);$('status').textContent=error?error.message:'Ник сохранён';if(!error)refresh()};$('logout').onclick=async()=>{await sb.auth.signOut();location.href='./login.html'}}refresh()})();</script></body></html>
