<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>[LEX]PIIVO — вход</title><link rel="stylesheet" href="./styles.css"><style>body{background:#101512;color:#e7ede5;font:16px system-ui;min-height:100vh;display:grid;place-items:center;margin:0}.auth{width:min(440px,calc(100% - 40px));padding:28px;border:1px solid #415c42;border-radius:18px;background:#1a281e;box-sizing:border-box}input{display:block;width:100%;box-sizing:border-box;margin:7px 0 16px;padding:13px;background:#101a13;color:#fff;border:1px solid #4c6450;border-radius:8px;font:inherit}button{cursor:pointer;padding:12px 16px;background:#b9d39b;border:0;border-radius:8px;color:#16221a;font-weight:700}a{color:#c6dfa8}p{line-height:1.5}#status{min-height:28px;color:#c6dfa8}#signed{display:none}main.auth{min-height:0!important;height:auto!important;max-height:none!important;display:block!important}label{font-size:14px}#switch{display:inline-block;margin-top:12px;text-decoration:underline;text-underline-offset:3px}#submit{width:100%;margin-top:5px}#signed a{display:block;text-align:center}input:autofill{background-color:#152219!important;color:#e7ede5!important}input:-webkit-autofill{-webkit-text-fill-color:#e7ede5!important;-webkit-box-shadow:0 0 0 1000px #142017 inset!important}.auth p{margin:10px 0}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="./registration-picker.js" defer></script></head><body><main class="auth"><p><a href="./#home">← В штаб</a></p><h1>[LEX]PIIVO</h1><p>Сервер 347 · Регистрация по нику, почте и паролю</p><form id="authForm"><label id="nickLabel">Игровой ник<input id="nickname" autocomplete="nickname" minlength="2" maxlength="40" required></label><label>Электронная почта<input id="email" type="email" autocomplete="email" required></label><label>Пароль<input id="password" type="password" autocomplete="new-password" minlength="8" required></label><button id="submit" type="submit">Зарегистрироваться</button></form><p><a href="#" id="switch">Уже есть аккаунт? Войти</a></p><div id="signed"><p id="welcome"></p><button id="logout">Выйти</button></div><p id="status" role="status" aria-live="polite"></p></main><script>
(()=>{'use strict';const sb=window.supabase.createClient('https://mcmzwkomuwzjkvggicyf.supabase.co','sb_publishable_bYnfQgWXe_6YeqU_v8CktQ_mY09szxO');let login=true;const $=id=>document.getElementById(id),msg=s=>$('status').textContent=s;
function mode(){ $('nickLabel').style.display=login?'none':'block';$('nickname').required=!login;$('submit').textContent=login?'Войти':'Зарегистрироваться';$('switch').textContent=login?'Нет аккаунта? Зарегистрироваться':'Уже есть аккаунт? Войти';$('password').autocomplete=login?'current-password':'new-password';}
$('switch').onclick=e=>{e.preventDefault();login=!login;mode();msg('')};
$('authForm').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;msg('Проверяем данные…');try{const email=$('email').value.trim(),password=$('password').value;let r;if(!login){const playerId=$('selectedGamePlayerId')?.value;if(!playerId)throw new Error('Сначала выбери свой игровой ник из списка');const check=await Promise.race([sb.rpc('is_game_player_registered',{p_game_player_id:playerId}),new Promise((_,reject)=>setTimeout(()=>reject(new Error('Не удалось проверить ник за 10 секунд. Повтори попытку позже.')),10000))]);if(check.error)throw new Error('Не удалось проверить регистрацию. Попробуй ещё раз.');if(check.data){msg('Этот игровой аккаунт уже зарегистрирован. Если это твой аккаунт, нажми «Войти». Если доступ потерян — обратись к R4/R5.');return;}}const operation=login?sb.auth.signInWithPassword({email,password}):sb.auth.signUp({email,password,options:{data:{nickname:$('nickname').value.trim(),game_player_id:$('selectedGamePlayerId')?.value||''},emailRedirectTo:location.origin+location.pathname}});const timeout=Symbol('timeout');r=await Promise.race([operation,new Promise(resolve=>setTimeout(()=>resolve(timeout),18000))]);if(r===timeout){msg('Сервер долго не отвечает. Не нажимайте регистрацию повторно. Попробуйте «Войти» с теми же данными через минуту, чтобы проверить, создан ли аккаунт.');return}if(r.error)throw r.error;if(!login&&!r.data.session)msg('Аккаунт создан. Если вход не выполнен автоматически, проверьте письмо или попробуйте войти.');else{msg('Готово! Перенаправляем в штаб…');location.replace('./#home');return}}catch(err){const detail=String(err?.message||'Ошибка регистрации');msg(/already registered|already exists|duplicate|database error saving new user/i.test(detail)?'Этот игровой аккаунт уже зарегистрирован или занят. Попробуй «Войти». Если аккаунт не твой — обратись к R4/R5.':detail+'. Если аккаунт уже создан, перейди в «Войти».')}finally{$('submit').disabled=false}};
async function refresh(){const {data:{user}}=await sb.auth.getUser();$('signed').style.display=user?'block':'none';$('authForm').hidden=!!user;$('switch').hidden=!!user;if(user){const {data}=await sb.from('clan_accounts').select('nickname,role').eq('user_id',user.id).maybeSingle();$('welcome').textContent='Вы вошли как '+(data?.nickname||user.email)+' · '+(data?.role||'member');const go=document.createElement('a');go.href='./#home';go.textContent='Перейти в штаб →';go.style.cssText='display:inline-block;background:#b9d39b;color:#16221a;padding:12px 16px;border-radius:8px;font-weight:700;margin-top:12px';$('signed').append(go);}}
$('logout').onclick=async()=>{await sb.auth.signOut();$('authForm').hidden=false;$('switch').hidden=false;msg('Вы вышли');refresh()};sb.auth.onAuthStateChange(()=>setTimeout(refresh,0));mode();refresh();
})();
</script></body></html>
